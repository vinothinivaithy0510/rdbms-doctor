spring.application.name=rdbms-doctor

# Server Port
server.port=${PORT:8080}

# Database Configuration (MySQL 8 with fallback support)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rdbms_doctor?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Fallback DB Configuration (used if MySQL is not available)
h2.datasource.url=jdbc:h2:mem:rdbms_doctor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
h2.datasource.username=sa
h2.datasource.password=
h2.datasource.driver-class-name=org.h2.Driver

# SQL Initialization Settings
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Optional AI Configuration
ai.api.key=${AI_API_KEY:}
ai.enabled=false

# Logging
logging.level.com.rdbmsdoctor=INFO
